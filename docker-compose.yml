version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: stellar-music-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-stellar_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-stellar_secret_password}
      POSTGRES_DB: ${DB_NAME:-stellar_music}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - stellar-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stellar-music-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://${DB_USER:-stellar_user}:${DB_PASSWORD:-stellar_secret_password}@postgres:5432/${DB_NAME:-stellar_music}
      STELLAR_NETWORK: ${STELLAR_NETWORK:-testnet}
      HORIZON_URL: ${HORIZON_URL:-https://horizon-testnet.stellar.org}
      STREAM_SIGNING_SECRET: ${STREAM_SIGNING_SECRET:-stellar_music_super_secure_hmac_secret_key_32_chars}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - "${PORT:-3001}:3001"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http = require('http'); http.get('http://localhost:3001/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1));\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - stellar-network

volumes:
  postgres_data:
    driver: local

networks:
  stellar-network:
    driver: bridge
